<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:60px 20px;
  background:#111c33;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  color:#94a3b8;
}

/* PROFILE */
.profile-container{
  display:flex;
  justify-content:center;
  margin-top:-50px;
}

.profile-img{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #38bdf8;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* SECTIONS */
.section{
  max-width:900px;
  margin:auto;
  padding:30px 20px;
}

.card{
  background:#111c33;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.title{
  color:#38bdf8;
  font-size:20px;
  margin-bottom:10px;
}

/* SKILLS */
.skills{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.skill{
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  text-align:center;
  border:1px solid #1e293b;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#64748b;
}
</style>

</head>

<body>

<header>
  <h1>Mohamed Aich</h1>
  <p>Portfolio Personnel</p>
</header>

<div class="profile-container">
  <img src="Foto.jpeg" class="profile-img">
</div>

<div class="section">

  <div class="card">
    <div class="title">À propos</div>
    <p>
      Je suis étudiant en électronique et automatisation, passionné par les systèmes industriels et la programmation.
    </p>
  </div>

  <div class="card">
    <div class="title">Compétences Techniques</div>
    <div class="skills">
      <div class="skill">Électronique</div>
      <div class="skill">Automatisation</div>
      <div class="skill">SPS</div>
      <div class="skill">Microcontrôleurs</div>
    </div>
  </div>

  <div class="card">
    <div class="title">Compétences IT</div>
    <div class="skills">
      <div class="skill">MS Office</div>
      <div class="skill">AutoCAD</div>
      <div class="skill">Proteus</div>
      <div class="skill">MikroC</div>
    </div>
  </div>

</div>

<footer>
  © 2026 Portfolio
</footer>

</body>
</html>
